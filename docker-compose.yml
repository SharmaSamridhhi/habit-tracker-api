services:
  db:
    image: postgres:16-alpine
    container_name: habit-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit_user
      POSTGRES_PASSWORD: habit_pass
      POSTGRES_DB: habit_tracker
    ports:
      - '5434:5432'
    volumes:
      - habit_tracker_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U habit_user -d habit_tracker']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: runtime
    container_name: habit-tracker-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://habit_user:habit_pass@db:5432/habit_tracker?schema=public
    ports:
      - '3000:3000'

volumes:
  habit_tracker_pgdata:
